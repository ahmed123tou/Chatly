<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chatly</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f1117;
            color: white;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }


        /* =========================
           AUTH
        ========================= */

        #authScreen {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;

            padding: 35px;

            background: #181b24;

            border: 1px solid #292e3a;
            border-radius: 18px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);

            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #5865f2;
            border-radius: 18px;

            font-size: 32px;
        }

        .auth-box h1 {
            margin: 0;

            font-size: 32px;
        }

        .subtitle {
            margin: 8px 0 30px;

            color: #949baa;
        }

        .auth-box h2 {
            margin: 0 0 20px;

            font-size: 21px;
        }

        .auth-input {
            width: 100%;
            height: 48px;

            margin-bottom: 12px;
            padding: 0 15px;

            border: 1px solid #303644;
            border-radius: 9px;

            outline: none;

            background: #10131a;
            color: white;

            font-size: 15px;
        }

        .auth-input:focus {
            border-color: #5865f2;
        }

        .auth-input::placeholder {
            color: #707786;
        }

        .main-auth-button {
            width: 100%;
            height: 48px;

            margin-top: 5px;

            border: none;
            border-radius: 9px;

            background: #5865f2;
            color: white;

            font-size: 15px;
            font-weight: bold;

            transition: 0.2s;
        }

        .main-auth-button:hover {
            background: #4752c4;
            transform: translateY(-1px);
        }

        .switch-text {
            margin-top: 20px;

            color: #8d94a3;

            font-size: 14px;
        }

        .switch-button {
            padding: 0;

            border: none;

            background: transparent;

            color: #7289ff;

            font-size: 14px;
        }

        .switch-button:hover {
            text-decoration: underline;
        }

        #authMessage {
            min-height: 20px;

            margin: 15px 0 0;

            color: #ff6b6b;

            font-size: 14px;
        }


        /* =========================
           CHAT
        ========================= */

        #chatScreen {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
        }

        .topbar {
            height: 65px;

            flex-shrink: 0;

            padding: 0 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            background: #181b24;

            border-bottom: 1px solid #292e3a;
        }

        .brand {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: 20px;
            font-weight: bold;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #5865f2;

            border-radius: 10px;

            font-size: 19px;
        }

        .user-area {
            display: flex;
            align-items: center;

            gap: 12px;
        }

        #currentUsername {
            color: #d8dbe3;

            font-size: 14px;
        }

        .logout-button {
            padding: 8px 13px;

            border: 1px solid #3a3f4c;
            border-radius: 8px;

            background: #20242e;
            color: #ddd;
        }

        .logout-button:hover {
            background: #2a2f3a;
        }


        /* =========================
           MESSAGES
        ========================= */

        #messages {
            flex: 1;

            overflow-y: auto;

            padding: 25px;
        }

        .empty-chat {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            color: #858c9b;

            text-align: center;
        }

        .empty-chat-icon {
            font-size: 50px;

            margin-bottom: 10px;
        }

        .empty-chat h2 {
            margin: 0 0 7px;

            color: #dfe2ea;
        }

        .empty-chat p {
            margin: 0;
        }


        /* =========================
           MESSAGE
        ========================= */

        .chat-message {
            max-width: 900px;

            margin: 0 auto 14px;

            padding: 13px 15px;

            background: #181b24;

            border: 1px solid #292e3a;

            border-radius: 12px;

            transition: 0.15s;
        }

        .chat-message:hover {
            border-color: #3a4050;
        }

        .message-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;
        }

        .message-user {
            color: #7289ff;

            font-weight: bold;
        }

        .message-id {
            color: #656c7b;

            font-size: 11px;
        }

        .message-content {
            margin-top: 8px;

            color: #e4e6eb;

            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.45;
        }

        .message-actions {
            display: flex;

            gap: 6px;

            margin-top: 10px;
        }

        .message-action {
            padding: 5px 8px;

            border: 1px solid #303644;

            border-radius: 7px;

            background: #20242e;

            color: #aeb4c1;

            font-size: 12px;
        }

        .message-action:hover {
            background: #2a2f3a;

            color: white;
        }


        /* =========================
           MESSAGE INPUT
        ========================= */

        .message-area {
            width: 100%;
            max-width: 930px;

            margin: 0 auto;

            padding: 15px 20px 20px;

            display: flex;

            gap: 10px;
        }

        #messageInput {
            flex: 1;

            height: 48px;

            padding: 0 15px;

            border: 1px solid #303644;

            border-radius: 10px;

            outline: none;

            background: #181b24;

            color: white;

            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #5865f2;
        }

        #messageInput::placeholder {
            color: #6e7584;
        }

        #sendButton {
            width: 85px;

            border: none;

            border-radius: 10px;

            background: #5865f2;

            color: white;

            font-weight: bold;
        }

        #sendButton:hover {
            background: #4752c4;
        }


        /* =========================
           REACTIONS
        ========================= */

        .reaction-area {
            display: flex;

            flex-wrap: wrap;

            gap: 5px;

            margin-top: 8px;
        }

        .reaction {
            padding: 4px 8px;

            border: 1px solid #303644;

            border-radius: 7px;

            background: #20242e;

            color: white;

            font-size: 13px;
        }

        .reaction:hover {
            background: #303644;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .auth-box {
                padding: 25px 20px;
            }

            .topbar {
                padding: 0 12px;
            }

            #currentUsername {
                max-width: 100px;

                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;
            }

            #messages {
                padding: 15px 10px;
            }

            .message-area {
                padding: 10px;
            }

            #sendButton {
                width: 70px;
            }

            .message-header {
                align-items: flex-start;

                flex-direction: column;

                gap: 4px;
            }
        }
    </style>
</head>

<body>


    <!-- =====================================
         LOGIN / SIGNUP SCREEN
    ====================================== -->

    <section id="authScreen">

        <div class="auth-box">

            <div class="logo">
                💬
            </div>

            <h1>Chatly</h1>

            <p class="subtitle">
                Simple online chatting.
            </p>


            <!-- LOGIN -->

            <div id="loginForm">

                <h2>
                    Welcome back
                </h2>

                <input
                    id="loginName"
                    class="auth-input"
                    type="text"
                    placeholder="Name"
                    maxlength="24"
                    autocomplete="username"
                >

                <input
                    id="loginPassword"
                    class="auth-input"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >

                <button
                    id="loginButton"
                    class="main-auth-button"
                    type="button"
                >
                    Login
                </button>

                <p class="switch-text">

                    Don't have an account?

                    <button
                        id="showSignup"
                        class="switch-button"
                        type="button"
                    >
                        Sign up
                    </button>

                </p>

            </div>


            <!-- SIGNUP -->

            <div
                id="signupForm"
                class="hidden"
            >

                <h2>
                    Create account
                </h2>

                <input
                    id="signupName"
                    class="auth-input"
                    type="text"
                    placeholder="Name"
                    maxlength="24"
                    autocomplete="username"
                >

                <input
                    id="signupPassword"
                    class="auth-input"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                >

                <input
                    id="signupPasswordConfirm"
                    class="auth-input"
                    type="password"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                >

                <button
                    id="signupButton"
                    class="main-auth-button"
                    type="button"
                >
                    Create Account
                </button>

                <p class="switch-text">

                    Already have an account?

                    <button
                        id="showLogin"
                        class="switch-button"
                        type="button"
                    >
                        Login
                    </button>

                </p>

            </div>


            <p id="authMessage"></p>

        </div>

    </section>



    <!-- =====================================
         CHAT SCREEN
    ====================================== -->

    <section
        id="chatScreen"
        class="hidden"
    >

        <header class="topbar">

            <div class="brand">

                <span class="brand-icon">
                    💬
                </span>

                <span>
                    Chatly
                </span>

            </div>


            <div class="user-area">

                <span id="currentUsername"></span>

                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    Logout
                </button>

            </div>

        </header>



        <!-- MESSAGES -->

        <main id="messages">

            <div class="empty-chat">

                <div class="empty-chat-icon">
                    💬
                </div>

                <h2>
                    Welcome to Chatly
                </h2>

                <p>
                    Start the conversation.
                </p>

            </div>

        </main>



        <!-- MESSAGE INPUT -->

        <div class="message-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                maxlength="1000"
                autocomplete="off"
            >

            <button
                id="sendButton"
                type="button"
            >
                Send
            </button>

        </div>

    </section>



    <script>

        /*
        =====================================================
        CHATLY
        Single-file version
        =====================================================

        Everything is inside this index.html.

        Current features:
        - Sign up
        - Login
        - Logout
        - Remember login after refresh
        - Multiple local accounts
        - Local messages
        - Message IDs
        - Copy message ID
        - Emoji reactions

        IMPORTANT:
        localStorage is only local to the browser.

        The next stage will connect the chat to an
        online database so different users can chat.
        */


        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =========================================
                   STORAGE KEYS
                ========================================= */

                const USERS_KEY =
                    "CHATLY_USERS";

                const CURRENT_USER_KEY =
                    "CHATLY_CURRENT_USER";

                const MESSAGES_KEY =
                    "CHATLY_MESSAGES";


                /* =========================================
                   ELEMENTS
                ========================================= */

                const authScreen =
                    document.getElementById("authScreen");

                const chatScreen =
                    document.getElementById("chatScreen");


                const loginForm =
                    document.getElementById("loginForm");

                const signupForm =
                    document.getElementById("signupForm");


                const loginName =
                    document.getElementById("loginName");

                const loginPassword =
                    document.getElementById("loginPassword");


                const signupName =
                    document.getElementById("signupName");

                const signupPassword =
                    document.getElementById("signupPassword");

                const signupPasswordConfirm =
                    document.getElementById(
                        "signupPasswordConfirm"
                    );


                const loginButton =
                    document.getElementById("loginButton");

                const signupButton =
                    document.getElementById("signupButton");


                const showSignup =
                    document.getElementById("showSignup");

                const showLogin =
                    document.getElementById("showLogin");


                const authMessage =
                    document.getElementById("authMessage");


                const logoutButton =
                    document.getElementById("logoutButton");


                const currentUsername =
                    document.getElementById(
                        "currentUsername"
                    );


                const messageInput =
                    document.getElementById(
                        "messageInput"
                    );

                const sendButton =
                    document.getElementById(
                        "sendButton"
                    );


                const messages =
                    document.getElementById(
                        "messages"
                    );


                /* =========================================
                   STORAGE FUNCTIONS
                ========================================= */

                function getUsers() {

                    try {

                        return JSON.parse(
                            localStorage.getItem(
                                USERS_KEY
                            )
                        ) || [];

                    } catch {

                        return [];

                    }

                }


                function saveUsers(users) {

                    localStorage.setItem(
                        USERS_KEY,
                        JSON.stringify(users)
                    );

                }


                function getMessages() {

                    try {

                        return JSON.parse(
                            localStorage.getItem(
                                MESSAGES_KEY
                            )
                        ) || [];

                    } catch {

                        return [];

                    }

                }


                function saveMessages(messageList) {

                    localStorage.setItem(
                        MESSAGES_KEY,
                        JSON.stringify(messageList)
                    );

                }


                function getCurrentUser() {

                    try {

                        return JSON.parse(
                            localStorage.getItem(
                                CURRENT_USER_KEY
                            )
                        );

                    } catch {

                        return null;

                    }

                }


                /* =========================================
                   SHOW LOGIN
                ========================================= */

                showLogin.addEventListener(
                    "click",
                    function () {

                        signupForm.classList.add(
                            "hidden"
                        );

                        loginForm.classList.remove(
                            "hidden"
                        );

                        authMessage.textContent = "";

                    }
                );


                /* =========================================
                   SHOW SIGNUP
                ========================================= */

                showSignup.addEventListener(
                    "click",
                    function () {

                        loginForm.classList.add(
                            "hidden"
                        );

                        signupForm.classList.remove(
                            "hidden"
                        );

                        authMessage.textContent = "";

                    }
                );


                /* =========================================
                   SIGN UP
                ========================================= */

                signupButton.addEventListener(
                    "click",
                    signup
                );


                signupPasswordConfirm.addEventListener(
                    "keydown",
                    function (event) {

                        if (event.key === "Enter") {

                            signup();

                        }

                    }
                );


                function signup() {

                    const name =
                        signupName.value.trim();

                    const password =
                        signupPassword.value;

                    const confirmPassword =
                        signupPasswordConfirm.value;


                    authMessage.style.color =
                        "#ff6b6b";


                    if (name.length < 2) {

                        authMessage.textContent =
                            "Name must be at least 2 characters.";

                        return;

                    }


                    if (name.length > 24) {

                        authMessage.textContent =
                            "Name must be 24 characters or less.";

                        return;

                    }


                    if (password.length < 4) {

                        authMessage.textContent =
                            "Password must be at least 4 characters.";

                        return;

                    }


                    if (password !== confirmPassword) {

                        authMessage.textContent =
                            "Passwords do not match.";

                        return;

                    }


                    const users =
                        getUsers();


                    const exists =
                        users.some(
                            function (user) {

                                return (
                                    user.name.toLowerCase() ===
                                    name.toLowerCase()
                                );

                            }
                        );


                    if (exists) {

                        authMessage.textContent =
                            "That name is already being used.";

                        return;

                    }


                    const newUser = {

                        id:
                            generateUserID(),

                        name:
                            name,

                        password:
                            password,

                        createdAt:
                            Date.now()

                    };


                    users.push(newUser);

                    saveUsers(users);


                    localStorage.setItem(
                        CURRENT_USER_KEY,
                        JSON.stringify({
                            id: newUser.id,
                            name: newUser.name
                        })
                    );


                    openChat();

                }


                /* =========================================
                   LOGIN
                ========================================= */

                loginButton.addEventListener(
                    "click",
                    login
                );


                loginPassword.addEventListener(
                    "keydown",
                    function (event) {

                        if (event.key === "Enter") {

                            login();

                        }

                    }
                );


                function login() {

                    const name =
                        loginName.value.trim();

                    const password =
                        loginPassword.value;


                    authMessage.style.color =
                        "#ff6b6b";


                    if (!name || !password) {

                        authMessage.textContent =
                            "Enter your name and password.";

                        return;

                    }


                    const users =
                        getUsers();


                    const user =
                        users.find(
                            function (user) {

                                return (
                                    user.name.toLowerCase() ===
                                    name.toLowerCase() &&
                                    user.password ===
                                    password
                                );

                            }
                        );


                    if (!user) {

                        authMessage.textContent =
                            "Incorrect name or password.";

                        return;

                    }


                    localStorage.setItem(
                        CURRENT_USER_KEY,
                        JSON.stringify({
                            id: user.id,
                            name: user.name
                        })
                    );


                    openChat();

                }


                /* =========================================
                   LOGOUT
                ========================================= */

                logoutButton.addEventListener(
                    "click",
                    logout
                );


                function logout() {

                    localStorage.removeItem(
                        CURRENT_USER_KEY
                    );


                    chatScreen.classList.add(
                        "hidden"
                    );

                    authScreen.classList.remove(
                        "hidden"
                    );


                    signupForm.classList.add(
                        "hidden"
                    );

                    loginForm.classList.remove(
                        "hidden"
                    );


                    loginName.value = "";

                    loginPassword.value = "";

                    authMessage.textContent = "";

                }


                /* =========================================
                   OPEN CHAT
                ========================================= */

                function openChat() {

                    const user =
                        getCurrentUser();


                    if (!user) {

                        return;

                    }


                    authScreen.classList.add(
                        "hidden"
                    );

                    chatScreen.classList.remove(
                        "hidden"
                    );


                    currentUsername.textContent =
                        user.name;


                    renderMessages();


                    setTimeout(
                        function () {

                            messageInput.focus();

                        },
                        100
                    );

                }


                /* =========================================
                   SEND MESSAGE
                ========================================= */

                sendButton.addEventListener(
                    "click",
                    sendMessage
                );


                messageInput.addEventListener(
                    "keydown",
                    function (event) {

                        if (event.key === "Enter") {

                            event.preventDefault();

                            sendMessage();

                        }

                    }
                );


                function sendMessage() {

                    const text =
                        messageInput.value.trim();


                    if (!text) {

                        return;

                    }


                    const user =
                        getCurrentUser();


                    if (!user) {

                        return;

                    }


                    const message = {

                        id:
                            generateMessageID(),

                        userId:
                            user.id,

                        username:
                            user.name,

                        text:
                            text,

                        reactions:
                            {},

                        createdAt:
                            Date.now()

                    };


                    const messageList =
                        getMessages();


                    messageList.push(message);

                    saveMessages(messageList);


                    messageInput.value = "";


                    renderMessages();

                    messageInput.focus();

                }


                /* =========================================
                   RENDER MESSAGES
                ========================================= */

                function renderMessages() {

                    const messageList =
                        getMessages();


                    messages.innerHTML = "";


                    if (messageList.length === 0) {

                        messages.innerHTML = `
                            <div class="empty-chat">
                                <div class="empty-chat-icon">
                                    💬
                                </div>

                                <h2>
                                    Welcome to Chatly
                                </h2>

                                <p>
                                    Start the conversation.
                                </p>
                            </div>
                        `;

                        return;

                    }


                    messageList.forEach(
                        function (message) {

                            const messageElement =
                                document.createElement(
                                    "div"
                                );


                            messageElement.className =
                                "chat-message";


                            /* HEADER */

                            const header =
                                document.createElement(
                                    "div"
                                );

                            header.className =
                                "message-header";


                            const username =
                                document.createElement(
                                    "span"
                                );

                            username.className =
                                "message-user";

                            username.textContent =
                                message.username;


                            const id =
                                document.createElement(
                                    "span"
                                );

                            id.className =
                                "message-id";

                            id.textContent =
                                "ID: " + message.id;


                            header.appendChild(
                                username
                            );

                            header.appendChild(
                                id
                            );


                            /* CONTENT */

                            const content =
                                document.createElement(
                                    "div"
                                );

                            content.className =
                                "message-content";

                            content.textContent =
                                message.text;


                            /* ACTIONS */

                            const actions =
                                document.createElement(
                                    "div"
                                );

                            actions.className =
                                "message-actions";


                            const copyButton =
                                document.createElement(
                                    "button"
                                );

                            copyButton.className =
                                "message-action";

                            copyButton.textContent =
                                "📋 Copy ID";


                            copyButton.addEventListener(
                                "click",
                                function () {

                                    copyMessageID(
                                        message.id,
                                        copyButton
                                    );

                                }
                            );


                            const reactButton =
                                document.createElement(
                                    "button"
                                );

                            reactButton.className =
                                "message-action";

                            reactButton.textContent =
                                "😀 React";


                            reactButton.addEventListener(
                                "click",
                                function () {

                                    addReaction(
                                        message.id,
                                        "😀"
                                    );

                                }
                            );


                            actions.appendChild(
                                copyButton
                            );

                            actions.appendChild(
                                reactButton
                            );


                            /* REACTIONS */

                            const reactionArea =
                                document.createElement(
                                    "div"
                                );

                            reactionArea.className =
                                "reaction-area";


                            if (
                                message.reactions &&
                                Object.keys(
                                    message.reactions
                                ).length > 0
                            ) {

                                Object.entries(
                                    message.reactions
                                ).forEach(
                                    function (
                                        [
                                            emoji,
                                            count
                                        ]
                                    ) {

                                        const reaction =
                                            document.createElement(
                                                "button"
                                            );

                                        reaction.className =
                                            "reaction";

                                        reaction.textContent =
                                            emoji +
                                            " " +
                                            count;


                                        reaction.addEventListener(
                                            "click",
                                            function () {

                                                addReaction(
                                                    message.id,
                                                    emoji
                                                );

                                            }
                                        );


                                        reactionArea.appendChild(
                                            reaction
                                        );

                                    }
                                );

                            }


                            messageElement.appendChild(
                                header
                            );

                            messageElement.appendChild(
                                content
                            );

                            messageElement.appendChild(
                                actions
                            );

                            messageElement.appendChild(
                                reactionArea
                            );


                            messages.appendChild(
                                messageElement
                            );

                        }
                    );


                    messages.scrollTop =
                        messages.scrollHeight;

                }


                /* =========================================
                   REACTIONS
                ========================================= */

                function addReaction(
                    messageID,
                    emoji
                ) {

                    const messageList =
                        getMessages();


                    const message =
                        messageList.find(
                            function (item) {

                                return (
                                    item.id ===
                                    messageID
                                );

                            }
                        );


                    if (!message) {

                        return;

                    }


                    if (!message.reactions) {

                        message.reactions = {};

                    }


                    if (
                        !message.reactions[emoji]
                    ) {

                        message.reactions[emoji] =
                            0;

                    }


                    message.reactions[emoji]++;


                    saveMessages(
                        messageList
                    );


                    renderMessages();

                }


                /* =========================================
                   COPY MESSAGE ID
                ========================================= */

                function copyMessageID(
                    id,
                    button
                ) {

                    if (
                        navigator.clipboard &&
                        navigator.clipboard.writeText
                    ) {

                        navigator.clipboard.writeText(
                            id
                        ).then(
                            function () {

                                const oldText =
                                    button.textContent;

                                button.textContent =
                                    "✅ Copied!";


                                setTimeout(
                                    function () {

                                        button.textContent =
                                            oldText;

                                    },
                                    1200
                                );

                            }
                        ).catch(
                            function () {

                                fallbackCopy(
                                    id,
                                    button
                                );

                            }
                        );

                    } else {

                        fallbackCopy(
                            id,
                            button
                        );

                    }

                }


                function fallbackCopy(
                    text,
                    button
                ) {

                    const textarea =
                        document.createElement(
                            "textarea"
                        );


                    textarea.value =
                        text;


                    document.body.appendChild(
                        textarea
                    );


                    textarea.select();


                    try {

                        document.execCommand(
                            "copy"
                        );


                        button.textContent =
                            "✅ Copied!";


                        setTimeout(
                            function () {

                                button.textContent =
                                    "📋 Copy ID";

                            },
                            1200
                        );

                    } catch {

                        alert(
                            "Could not copy the ID."
                        );

                    }


                    textarea.remove();

                }


                /* =========================================
                   ID GENERATORS
                ========================================= */

                function randomString(
                    length
                ) {

                    const characters =
                        "abcdefghijklmnopqrstuvwxyz0123456789";


                    let result = "";


                    for (
                        let i = 0;
                        i < length;
                        i++
                    ) {

                        result +=
                            characters[
                                Math.floor(
                                    Math.random() *
                                    characters.length
                                )
                            ];

                    }


                    return result;

                }


                function generateUserID() {

                    return (
                        "user_" +
                        Date.now().toString(36) +
                        "_" +
                        randomString(6)
                    );

                }


                function generateMessageID() {

                    return (
                        "msg_" +
                        Date.now().toString(36) +
                        "_" +
                        randomString(6)
                    );

                }


                /* =========================================
                   START CHATLY
                ========================================= */

                const currentUser =
                    getCurrentUser();


                if (currentUser) {

                    openChat();

                } else {

                    authScreen.classList.remove(
                        "hidden"
                    );

                    chatScreen.classList.add(
                        "hidden"
                    );

                }

            }
        );

    </script>
